spring.application.name=clareia

# H2 em memoria (prototipo). Progresso e pontuacao persistem enquanto o app roda.
spring.datasource.url=jdbc:h2:mem:clareia;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 (desligado por padrao; em dev local, rode com H2_CONSOLE=true)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Porta: o Render injeta $PORT; em dev local cai para 8080.
server.port=${PORT:8080}
